name: Validate template
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20.18.3', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Generate a project from this checkout
        env:
          CREATE_SCAFFOLD_HBAR_TEMPLATE_DIR: ${{ github.workspace }}
          GIT_AUTHOR_NAME: ConsensusKit CI
          GIT_AUTHOR_EMAIL: ci@consensuskit.local
          GIT_COMMITTER_NAME: ConsensusKit CI
          GIT_COMMITTER_EMAIL: ci@consensuskit.local
        run: |
          cd "$RUNNER_TEMP"
          set +e
          npx --yes create-scaffold-hbar@0.4.0 sample-events --template anoop04singh/consensus-kit#master --frontend none --solidity-framework none --network testnet --package-manager npm --skip-hedera-skills --ci > scaffold.log 2>&1
          result=$?
          cat scaffold.log
          if [ "$result" -ne 0 ]; then
            node -e 'const fs=require("node:fs"); const lines=fs.readFileSync("scaffold.log","utf8").trim().split(/\r?\n/).slice(-18); console.log("::error title=Scaffold generation failed::"+lines.join(" | ").replace(/%/g,"%25").replace(/\r/g,"%0D").replace(/\n/g,"%0A"));'
            exit "$result"
          fi
      - name: Check installed runtime and generated project
        run: |
          cd "$RUNNER_TEMP/sample-events"
          node -e "require('node:module').createRequire(require.resolve('@hiero-ledger/proto')).resolve('protobufjs/minimal.js')"
          npm run setup -- --help
          npm run lint
          npm test
          npm run build
